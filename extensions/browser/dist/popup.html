<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Code Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          15px/1.5 system-ui,
          "Segoe UI",
          sans-serif;
        color: CanvasText;
        background: Canvas;
        --muted: color-mix(in srgb, CanvasText 67%, Canvas);
        --border: color-mix(in srgb, CanvasText 19%, Canvas);
        --panel: color-mix(in srgb, CanvasText 4%, Canvas);
        --accent: #6b8afd;
        --error: #d85151;
        --success: #238b63;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 430px;
        margin: 0;
        padding: 20px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 1px 0 13px;
        border-bottom: 1px solid var(--border);
      }
      .brand-mark {
        display: block;
        flex: 0 0 40px;
        width: 36px;
        height: 36px;
        object-fit: contain;
        border-radius: 5px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }
      .subtitle,
      .help,
      .section-description {
        color: var(--muted);
      }
      .subtitle {
        margin: 1px 0 0;
        font-size: 13px;
      }
      section {
        padding: 17px 0;
        border-bottom: 1px solid var(--border);
      }
      .section-heading {
        display: flex;
        align-items: baseline;
        gap: 7px;
        margin-bottom: 3px;
      }
      .step {
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
      }
      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }
      .section-description {
        margin: 0 0 9px 21px;
        font-size: 13px;
      }
      label {
        display: block;
        margin: 9px 0 4px;
        font-size: 13px;
        font-weight: 600;
      }
      input {
        display: block;
        width: 100%;
        min-height: 42px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: FieldText;
        background: Field;
        font: inherit;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .help {
        display: block;
        margin-top: 5px;
        font-size: 12px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      button {
        min-height: 40px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: ButtonText;
        background: ButtonFace;
        font: inherit;
        font-size: 13px;
        font-weight: 550;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      button.primary {
        color: #fff;
        background: #375bd2;
        border-color: #375bd2;
      }
      .connection-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .connection-actions button {
        width: 100%;
      }
      #status {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-height: 44px;
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--panel);
        overflow-wrap: anywhere;
      }
      #status:empty {
        display: none;
      }
      #status[data-state="error"] {
        border-color: color-mix(in srgb, var(--error) 45%, var(--border));
      }
      #status[data-state="success"] {
        border-color: color-mix(in srgb, var(--success) 45%, var(--border));
      }
      #status-dot {
        flex: 0 0 8px;
        width: 8px;
        height: 8px;
        margin-top: 6px;
        border-radius: 50%;
        background: var(--muted);
      }
      #status[data-state="error"] #status-dot {
        background: var(--error);
      }
      #status[data-state="success"] #status-dot {
        background: var(--success);
      }
      #status-text {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <img class="brand-mark" src="icons/deepseek.png" alt="" aria-hidden="true" />
      <div>
        <h1>DeepSeek Code Agent</h1>
        <p class="subtitle">Connect your signed-in chat to VS Code</p>
      </div>
    </header>

    <section aria-labelledby="pair-heading">
      <div class="section-heading">
        <span class="step">01</span>
        <h2 id="pair-heading">Connect VS Code</h2>
      </div>
      <p class="section-description">
        Pair once with the code shown in the VS Code sidebar. Choose your conversation URL in VS Code settings.
      </p>
      <label for="bridge-url">Local bridge address</label>
      <input id="bridge-url" type="url" value="http://127.0.0.1:43127" autocomplete="url" />
      <label for="pairing">One-time pairing code</label>
      <input id="pairing" inputmode="numeric" autocomplete="off" placeholder="Enter the code from VS Code" />
      <div class="actions">
        <button id="pair" class="primary" type="button">Pair with VS Code</button>
        <button id="health" type="button">Check status</button>
      </div>
    </section>

    <div id="status" role="status" aria-live="polite" hidden>
      <span id="status-dot" aria-hidden="true"></span>
      <span id="status-text"></span>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
